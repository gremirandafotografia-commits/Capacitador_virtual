<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacitador de Trámites · Coopelesca</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --azul-950:#071a3a;
  --azul-900:#0c2a5e;
  --azul-800:#123c82;
  --azul-700:#1a4fa0;
  --azul-600:#2563c9;
  --azul-100:#e7edf9;
  --azul-050:#f4f7fd;
  --ambar-500:#f2a71b;
  --ambar-600:#d98f0b;
  --verde-600:#1f9d55;
  --verde-100:#e4f7ea;
  --rojo-600:#d64545;
  --rojo-100:#fbe8e8;
  --tinta:#132039;
  --tinta-suave:#546079;
  --linea:#dde4f0;
  --papel:#ffffff;
  --fondo:#eef2fa;
  --radio:14px;
  --serif:'Calibri', 'Carlito', 'Segoe UI', Arial, sans-serif;
  --sans:'Calibri', 'Carlito', 'Segoe UI', Arial, sans-serif;
  --mono:'Calibri', 'Carlito', ui-monospace, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  font-size:12pt;
  background:
    radial-gradient(1100px 600px at 100% -10%, #14356f 0%, transparent 60%),
    var(--fondo);
  color:var(--tinta);
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:700; margin:0 0 .5em 0; color:var(--azul-950);}
p{line-height:1.6; margin:.4em 0;}
button{font-family:var(--sans); cursor:pointer;}
::selection{background:var(--ambar-500); color:var(--azul-950);}

/* ============================================================
   SHELL
   ============================================================ */
.shell{
  display:grid;
  grid-template-columns:300px 1fr;
  min-height:100vh;
}
@media (max-width: 880px){
  .shell{grid-template-columns:1fr;}
  .sidebar{position:sticky; top:0; z-index:30; max-height:none;}
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  background:linear-gradient(180deg, var(--azul-950), var(--azul-900) 60%, var(--azul-800));
  color:#fff;
  padding:26px 18px 30px;
  display:flex; flex-direction:column; gap:18px;
  position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
}
.brand{display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:2px 4px 14px; border-bottom:1px solid rgba(255,255,255,.14);}
.brand-logo{height:34px; width:auto; display:block;}
.brand-text{line-height:1.2;}
.brand-text .t1{font-family:var(--serif); font-weight:700; font-size:15.5px;}
.brand-text .t2{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:#b9c9ec;}

.progress-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:var(--radio);
  padding:14px 16px;
}
.progress-card .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#b9c9ec; margin-bottom:6px;}
.progress-bar{height:9px; border-radius:6px; background:rgba(255,255,255,.15); overflow:hidden; margin:6px 0 8px;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--ambar-500), #ffd680); border-radius:6px; transition:width .5s ease;}
.progress-num{font-family:var(--mono); font-size:12.5px; color:#e9eefb;}

.nav-group-title{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:#8fa4d4;
  margin:6px 4px 2px; font-weight:700;
}
.nav-group{ border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:4px; }
.nav-group-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 8px; cursor:pointer; border-radius:9px;
  transition:background .15s ease;
}
.nav-group-head:hover{ background:rgba(255,255,255,.06); }
.nav-group-head .ttl{
  font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:#c3d1f0; font-weight:700;
  display:flex; align-items:center; gap:8px;
}
.nav-group-head .cnt{
  font-family:var(--mono); font-size:10px; color:#8fa4d4; background:rgba(255,255,255,.08);
  padding:1px 7px; border-radius:20px;
}
.nav-group-head .chev{
  font-size:11px; color:#8fa4d4; transition:transform .2s ease; flex:none;
}
.nav-group.open .nav-group-head .chev{ transform:rotate(90deg); }
.nav-group.open .nav-group-head{ background:rgba(255,255,255,.05); }
.nav-list-wrap{
  max-height:0; overflow:hidden; transition:max-height .25s ease;
}
.nav-group.open .nav-list-wrap{ max-height:900px; }
.nav-list{list-style:none; margin:0 0 6px; padding:0; display:flex; flex-direction:column; gap:3px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:10px; cursor:pointer;
  font-size:13.3px; color:#dde6fa;
  border:1px solid transparent;
  transition:background .15s ease;
}
.nav-item:hover{background:rgba(255,255,255,.08);}
.nav-item.active{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.2); color:#fff;}
.nav-num{
  flex:none; width:22px; height:22px; border-radius:7px;
  background:rgba(255,255,255,.12);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10.5px; color:#c9d6f2;
}
.nav-item.done .nav-num{background:var(--verde-600); color:#fff;}
.nav-title{flex:1;}
.nav-score{font-family:var(--mono); font-size:10.5px; color:#9db3e0;}
.nav-item.done .nav-score{color:#8fe3ae;}

.final-cta{
  margin-top:auto;
  padding-top:14px; border-top:1px solid rgba(255,255,255,.14);
}
.btn-final{
  width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 14px; border-radius:11px; border:none;
  background:linear-gradient(135deg, var(--ambar-500), var(--ambar-600));
  color:var(--azul-950); font-weight:700; font-size:13.5px;
  box-shadow:0 8px 20px -8px rgba(242,167,27,.6);
}
.btn-final:disabled{opacity:.45; cursor:not-allowed; box-shadow:none;}
.final-hint{font-size:11px; color:#a9bbe4; text-align:center; margin-top:8px; line-height:1.4;}

/* ---------- MAIN ---------- */
.main{padding:38px 44px 70px; max-width:920px; width:100%;}
@media (max-width:880px){ .main{padding:26px 18px 60px;} }

.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--azul-700); font-weight:700; margin-bottom:10px;
}
.eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--ambar-500);}

.page-title{font-size:32px; line-height:1.15; margin-bottom:6px;}
.page-sub{color:var(--tinta-suave); font-size:15px; max-width:640px;}

.card{
  background:var(--papel);
  border:1px solid var(--linea);
  border-radius:var(--radio);
  box-shadow:0 1px 2px rgba(15,30,65,.04);
}

/* ---- HOME ---- */
.home-hero{
  padding:30px 32px; margin:22px 0 26px;
  background:linear-gradient(135deg, var(--azul-900), var(--azul-700));
  color:#fff; border-radius:18px; position:relative; overflow:hidden;
}
.home-hero::after{
  content:"⚡"; position:absolute; right:22px; top:8px; font-size:120px; opacity:.08;
}
.home-hero h2{color:#fff; font-size:24px;}
.home-hero p{color:#dbe4fb; max-width:560px;}
.home-stats{display:flex; gap:22px; margin-top:18px; flex-wrap:wrap;}
.home-stat{}
.home-stat .n{font-family:var(--serif); font-size:26px; font-weight:700;}
.home-stat .l{font-size:11.5px; color:#bcd0f6; text-transform:uppercase; letter-spacing:.06em;}

.module-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; margin-top:6px;}
.mod-card{
  padding:16px 17px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease;
}
.mod-card:hover{transform:translateY(-2px); box-shadow:0 10px 24px -12px rgba(15,30,65,.25);}
.mod-card .cat{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--azul-600); font-weight:700;}
.mod-card h4{font-size:15.5px; margin:5px 0 6px;}
.mod-card .desc{font-size:12.6px; color:var(--tinta-suave); line-height:1.5; min-height:36px;}
.mod-card .foot{display:flex; align-items:center; justify-content:space-between; margin-top:12px;}
.badge{
  font-size:10.5px; padding:3px 9px; border-radius:20px; font-weight:700;
  background:var(--azul-100); color:var(--azul-700);
}
.badge.done{background:var(--verde-100); color:var(--verde-600);}

/* ---- TOPIC THEORY ---- */
.topic-header{margin-bottom:18px;}
.section-block{
  padding:22px 26px; margin-bottom:18px;
}
.section-block h3{font-size:17.5px; display:flex; align-items:center; gap:9px; margin-bottom:10px;}
.section-block h3 .ico{
  width:26px; height:26px; border-radius:8px; background:var(--azul-100); color:var(--azul-700);
  display:flex; align-items:center; justify-content:center; font-size:13px; flex:none;
}
.section-block ul{margin:8px 0 0; padding-left:20px;}
.section-block li{margin:6px 0; line-height:1.55; font-size:14.3px;}
.section-block p{font-size:14.3px;}
.key-fact{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--azul-050); border:1px solid var(--azul-100); border-radius:10px;
  padding:10px 13px; margin:8px 0; font-size:13.6px;
}
.key-fact b{color:var(--azul-800);}
.shot-wrap{ margin:12px 0 4px; border-radius:10px; overflow:hidden; border:1px solid var(--linea); }
.shot-wrap img{ display:block; width:100%; height:auto; }
.shot-cap{ font-size:11.5px; color:var(--tinta-suave); padding:6px 2px 0; font-style:italic; }
.warn-fact{
  background:#fff8ea; border:1px solid #f4dfa8; border-radius:10px;
  padding:10px 13px; margin:8px 0; font-size:13.6px; display:flex; gap:10px;
}
.systems-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.chip{
  font-family:var(--mono); font-size:11.5px; padding:4px 10px; border-radius:7px;
  background:var(--azul-950); color:#ffd680; letter-spacing:.02em;
}

.topic-actions{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:20px 26px; margin-top:6px; flex-wrap:wrap;
}
.btn-primary{
  padding:12px 22px; border-radius:11px; border:none; background:var(--azul-800); color:#fff;
  font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:8px;
}
.btn-primary:hover{background:var(--azul-700);}
.btn-ghost{
  padding:11px 18px; border-radius:11px; border:1px solid var(--linea); background:#fff; color:var(--tinta);
  font-weight:600; font-size:13.5px;
}
.last-score{font-size:13px; color:var(--tinta-suave);}
.last-score b{color:var(--verde-600);}

/* ---- QUIZ ---- */
.quiz-wrap{padding:26px 30px; margin-top:18px;}
.quiz-progress{display:flex; gap:6px; margin-bottom:20px;}
.quiz-progress .seg{flex:1; height:6px; border-radius:4px; background:var(--linea);}
.quiz-progress .seg.on{background:var(--azul-700);}
.quiz-progress .seg.ok{background:var(--verde-600);}
.quiz-progress .seg.bad{background:var(--rojo-600);}
.q-count{font-size:11.5px; color:var(--tinta-suave); text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin-bottom:8px;}
.q-text{font-size:18px; font-family:var(--serif); font-weight:700; margin-bottom:18px; line-height:1.4;}
.opt-list{display:flex; flex-direction:column; gap:10px;}
.opt{
  display:flex; align-items:flex-start; gap:12px;
  padding:13px 15px; border-radius:11px; border:1.5px solid var(--linea); background:#fff;
  font-size:14px; line-height:1.45; text-align:left;
}
.opt:hover{border-color:var(--azul-600);}
.opt .letter{
  flex:none; width:24px; height:24px; border-radius:7px; background:var(--azul-050); color:var(--azul-700);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:var(--mono);
}
.opt.correct{border-color:var(--verde-600); background:var(--verde-100);}
.opt.correct .letter{background:var(--verde-600); color:#fff;}
.opt.wrong{border-color:var(--rojo-600); background:var(--rojo-100);}
.opt.wrong .letter{background:var(--rojo-600); color:#fff;}
.opt:disabled{cursor:default;}
.opt:not(:disabled):hover{box-shadow:0 3px 10px -4px rgba(15,30,65,.2);}

.explain{
  margin-top:16px; padding:13px 16px; border-radius:10px; font-size:13.6px; line-height:1.55;
  background:var(--azul-050); border:1px solid var(--azul-100);
}
.explain.ok{background:var(--verde-100); border-color:#bfe8cc;}
.explain.bad{background:var(--rojo-100); border-color:#f2c6c6;}

.quiz-footer{display:flex; justify-content:flex-end; margin-top:20px;}

/* ---- RESULT ---- */
.result-wrap{padding:40px 34px; text-align:center; margin-top:18px;}
.result-ring{
  width:120px; height:120px; border-radius:50%; margin:0 auto 18px;
  display:flex; align-items:center; justify-content:center; position:relative;
  background:conic-gradient(var(--verde-600) calc(var(--pct)*1%), var(--linea) 0);
}
.result-ring::before{content:""; position:absolute; inset:9px; background:#fff; border-radius:50%;}
.result-ring span{position:relative; font-family:var(--serif); font-size:26px; font-weight:700;}
.result-title{font-size:22px;}
.result-msg{color:var(--tinta-suave); max-width:440px; margin:6px auto 22px;}
.result-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

/* misc */
.foot-note{
  margin-top:34px; padding-top:18px; border-top:1px dashed var(--linea);
  font-size:11.8px; color:var(--tinta-suave); line-height:1.6;
}
.back-link{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--azul-700);
  font-weight:600; margin-bottom:14px; background:none; border:none; padding:0;
}
.pill-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px;}
.pill{font-size:11.5px; padding:5px 11px; border-radius:20px; background:var(--azul-950); color:#ffd680; font-family:var(--mono);}
</style>
</head>
<body>
<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script>
/* ================================================================
   CAPACITADOR DE TRÁMITES · COOPELESCA
   ----------------------------------------------------------------
   CÓMO ACTUALIZAR ESTE CAPACITADOR CUANDO CAMBIEN LOS REQUISITOS:
   1) Cada trámite es un objeto dentro del arreglo MODULES.
   2) "theory" es una lista de bloques (icono + título + contenido).
      El contenido puede ser texto simple, una lista (bullets),
      datos clave (facts) o advertencias (warn).
   3) "quiz" es una lista de preguntas de opción múltiple con:
      q: enunciado, options: 4 opciones, correct: índice (0-3),
      explain: retroalimentación que se muestra siempre.
   4) Para agregar un trámite nuevo, copia un bloque completo de
      MODULES, cámbiale el id (único), el título y el contenido.
   5) La "Evaluación final" toma preguntas automáticamente del
      arreglo FINAL_EXAM_IDS (2 por tema). Puedes editar esa lista.

    {ico:'②', h:'Validación en el IMAS', list:[
      'Se verifica en la página del IMAS si la persona tiene el beneficio, su quintil y si está activo.',
      'Azul = pertenece a "Hogares Conectados"; rojo = pertenece a "Becados MEP" (hay que tener mucho cuidado en distinguirlos).'
    ]},
    {ico:'③', h:'Promociones según etapa', list:[
      'Mientras se espera la aprobación del IMAS: promoción "Familias Coopelesca" (40% de descuento quintil 1, 30% quintil 2).',
      'Una vez aprobado el beneficio: promoción "Todos Conectados" ($10 quintil 1, $23 quintil 2).'
    ]},
    {ico:'④', h:'M.2 Reincorporaciones', p:'Aplica cuando el asociado había retirado el servicio y devuelto el equipo, pero regresa después, siempre que continúe asignado a Coopelesca en el sistema del IMAS. El plan a vender depende del ciclo de facturación actual (si aún no se facturó el mes, no se puede vender "Todos Conectados" directamente; se aplica "Familias Coopelesca").'},
    {ico:'⑤', h:'M.3 Retiros', warn:'No se pueden trasladar deudas diferidas entre productos distintos (por ejemplo, de un internet a un servicio de luz).'},
    {ico:'⑥', h:'M.4 Cambios de titular', p:'Se hace una cesión de derechos a otro miembro DENTRO del mismo núcleo familiar, con boletas de entrega y de compromiso de quien recibe.'},
    {ico:'⑦', h:'Coordinación', p:'Toda la documentación de estos trámites se envía por correo a Karen, quien da seguimiento y aplica los cambios de plan comercial una vez aprobados.'}
  ],
  quiz:[
    {q:'¿Se reciben solicitudes NUEVAS del programa Hogares Conectados actualmente?', options:['Sí, sin restricciones','No, el programa ya está cerrado; solo se gestiona a quienes ya tienen el beneficio','Solo los fines de semana','Solo para comercios'], correct:1, explain:'El programa ya cerró para solicitudes nuevas; solo aplica para gestiones de quienes ya poseen el beneficio.'},
    {q:'En la validación del IMAS, ¿qué color indica que la persona pertenece a "Becados MEP" (y no a Hogares Conectados)?', options:['Azul','Verde','Rojo','Amarillo'], correct:2, explain:'Azul = Hogares Conectados; Rojo = Becados MEP. Hay que distinguirlos con cuidado.'},
    {q:'¿Se puede trasladar una deuda diferida de un internet a un servicio de luz?', options:['Sí, siempre','No, no se permite trasladar diferidos entre productos distintos','Solo con autorización de Karen','Solo si el asociado lo pide por escrito'], correct:1, explain:'No se pueden trasladar diferidos entre productos distintos; no se permite pasar una deuda diferida de internet a luz.'},
    {q:'¿A quién se le envía la documentación de los trámites de Hogares Conectados para seguimiento?', options:['Al líder de plataforma','A Karen','A Tesorería','A CFIA'], correct:1, explain:'La documentación se envía por correo a Karen, encargada de dar seguimiento y aplicar los cambios cuando corresponda.'}
  ]
},
{

  title:'Alumbrado Público',
  desc:'Solicitud de lámpara nueva vs. reporte de daño de lámpara existente.',
  systems:['SALESFORCE','TTRFE (Smartflex)'],
  theory:[
    {ico:'①', h:'Dos trámites distintos, dos sistemas distintos', list:[
      'N.1 Solicitud de alumbrado público NUEVO: se hace SOLO en Salesforce (NO en Smartflex).',
      'N.2 Reportar DAÑO de una lámpara existente: se hace SOLO en Smartflex/TTRFE (NO en Salesforce).'
    ]},
    {ico:'②', h:'N.1 — Solicitud de lámpara pública', list:['Salesforce → Nuevo caso → Trámites → "Solicitud de lámpara pública".','Se anota el número de poste, la razón de la solicitud y el teléfono de contacto.']},
    {ico:'③', h:'N.2 — Reportar daño', list:[

      'Se selecciona el tipo de falla; en "fecha de inicio de afectación" se anota un estimado de días antes de la visita del asociado (no necesariamente el mismo día del reporte).',

  quiz:[
    {q:'¿En qué sistema se hace la SOLICITUD de una lámpara pública nueva?', options:['Solo en Smartflex (TTRFE)','Solo en Salesforce','En ambos sistemas por igual','En CAGCA'], correct:1, explain:'La solicitud de alumbrado público nuevo se hace únicamente en Salesforce.'},
    {q:'¿En qué sistema se REPORTA un daño de una lámpara ya existente?', options:['Solo en Salesforce','Solo en Smartflex, ventana TTRFE','En CCGAC','En COACO'], correct:1, explain:'El reporte de daño de alumbrado público se hace únicamente en Smartflex, en la ventana TTRFE.'},
    {q:'Al reportar un daño, ¿qué se anota como dirección en la búsqueda del elemento?', options:['El nombre de la calle','"CR" seguido del número de poste','El número de cédula','El código de la cuadrilla'], correct:1, explain:'En dirección se anota "CR" junto con el número de poste correspondiente.'}
  ]
},
{
  id:'cierre_caja',
  cat:'Procedimientos de Caja',
  title:'Procedimiento de cierre de caja (CAGCA)',
  desc:'Diez pasos para cerrar caja correctamente cada día.',
  systems:['CAGCA','OPEN','QUPOS','SHAREPOINT'],
  theory:[
    {ico:'①', h:'Preparación y depósito bancario', list:['CAGCA → Operación → Depósito bancario.','Revisar los datáfonos: montos de reportes correctos → consignar según lote/fecha (CJ2) → aceptar uno por uno → escanear cierres (voucher) y cheques si los hay.']},
    {ico:'②', h:'Conteo de efectivo', warn:'Regla de oro: contar el efectivo SIN cerrar el sistema. Se compara el monto que indica el sistema contra el dinero físico, se hace la consigna en Open y se verifica que quede únicamente el fondo de caja correspondiente a ¢200.000.'},
    {ico:'③', h:'Validación con Excel', list:['Se compara en el archivo de control (Cuadre de Caja) el subtotal y el sub-fondo: deben dar ¢200.000.','Se permite una diferencia máxima de ¢1.000.']},
    {ico:'④', h:'Cierre en CAGCA', list:['Si todo coincide: se cierra la caja en CAGCA (Operación → Cierre de caja).','Si hay faltante: se debe reponer. Si hay sobrante: se hace boleta de Open aparte, se entrega, pero NO se reporta en el sistema.']},
    {ico:'⑤', h:'Registro, depósito y reportes', list:['En Excel se registra boleta, monto y sistema (Open/Qupos), incluyendo datáfonos y efectivo.','En CAGCA → Depósito bancario se ingresa número de lote (voucher) y fecha.','Se generan los reportes de Documentos de caja (CAGCA) con el número de cajero y fecha.']},
    {ico:'⑥', h:'Envío y archivo', list:['Todos los PDFs se envían por correo, adjuntando los archivos correctos.','En SharePoint → "Cierre de cajas por punto de venta": nuevo registro con fecha, punto de venta, nombre del cajero, comentarios y adjuntando PDFs y el Excel.','Los documentos físicos (vouchers, boletas) se escanean, agrupan, rotulan y se entregan a la persona encargada.']}
  ],
  quiz:[
    {q:'¿Cuál es la regla de oro al contar el efectivo de caja?', options:['Contar con el sistema cerrado','Contar el efectivo SIN cerrar el sistema','Contar solo una vez por semana','Contar en presencia del líder siempre'], correct:1, explain:'El efectivo se debe contar sin cerrar el sistema, comparándolo contra lo que indica en pantalla.'},
    {q:'¿Cuánto es el fondo de caja que debe quedar después del cierre, y cuál es la diferencia máxima permitida?', options:['¢100.000, sin diferencia permitida','¢200.000, con diferencia máxima de ¢1.000','¢50.000, con diferencia máxima de ¢5.000','¢200.000, sin ninguna diferencia permitida'], correct:1, explain:'El fondo de caja correspondiente es ¢200.000, con una diferencia máxima permitida de ¢1.000.'},
    {q:'Si al cuadrar la caja hay un SOBRANTE, ¿qué se hace?', options:['Se reporta como ingreso extra en el sistema','Se hace boleta de Open aparte, se entrega, pero no se reporta en el sistema','Se guarda para el día siguiente sin boleta','Se descarta'], correct:1, explain:'Con sobrante se hace una boleta de Open en bolsa aparte y se entrega, pero no se reporta en el sistema (a diferencia del faltante, que sí debe reponerse).'},
    {q:'¿Dónde se sube finalmente el registro de cierre de caja del día (PDFs y Excel)?', options:['A CAGCA únicamente','A SharePoint, en "Cierre de cajas por punto de venta"','Al correo del asociado','A COACO'], correct:1, explain:'El registro final con fecha, punto de venta, cajero y adjuntos (PDFs + Excel) se sube a SharePoint en "Cierre de cajas por punto de venta".'}
  ]
},
{
  id:'sistemas_rapidos',
  cat:'Sistemas y Códigos',
  title:'Guía rápida: CCGAC, FAGFI y ArcGIS',
  desc:'Códigos y atajos operativos frecuentes en ventas y cobros.',
  systems:['CCGAC','FAGFI','ArcGIS','COACO'],
  theory:[
    {ico:'①', h:'Venta de servicio de cable (guía operativa rápida)', list:[
      'Requisitos: cédula y número de abonado de la casa/medidor donde se instalará.',
      'Costo: ¢12.500 (más ¢1.000 si hay que asociar al cliente).',
      'En ArcGIS se busca disponibilidad de cable: se seleccionan las capas COAXIAL y COFI-TAP. Distancia máxima: 100 m.',
      'Paquetes disponibles de 30 y 60 canales; cada caja adicional tiene un costo aproximado de ¢1.300.'
    ]},
    {ico:'②', h:'Cobro con FAGFI', list:[
      'Para cobrar los ¢12.500 en FAGFI: número de cédula → número de contrato → número de producto → concepto "57 AP capital info" → causa "8" → "D" → monto ¢12.500.',
      'Cuota de ingreso (asociación): ¢1.000. Aporte de capital de vivienda: ¢390 (según trámite).',
      'Código de "diseño de planos eléctricos" (declaración de carga) en FAGFI: 2705, con código de IVA 700.'
    ]},
    {ico:'③', h:'Anular una venta', p:'Contrato → producto → solicitud → "Anular solicitud" → motivo #9 → explicar el porqué de la anulación.'},
    {ico:'④', h:'Retiro de servicio de cable (sin equipo completo)', warn:'Si el asociado NO devuelve el equipo completo: la caja decodificadora vale ¢45.000 y cada cable/control vale ¢7.000. Se hace un FAGFI y luego se cobra en CAGCA.'},
    {ico:'⑤', h:'Cartera castigada y grupos de recaudo', list:[
      'Cartera castigada: se revisa en COACO ("Consulta de cartera castigada"); las facturas iguales se deben sumar antes de cobrar en CAGCA.',
      'Grupos de recaudo: CAGCA → Operación → Grupo de recaudo, permite agrupar varios contratos para cobrarlos juntos por número de grupo.'
    ]},
    {ico:'⑥', h:'Carta de disponibilidad', p:'Requiere: cédula, plano catastro y número de medidor vecino o poste. Se llena una vez verificada la disponibilidad en ArcGIS, se anota el consecutivo en el Excel de cartas de disponibilidad, y se imprime y firma físicamente.'}
  ],
  quiz:[
    {q:'¿Cuál es el costo base de la venta de servicio de cable (antes de asociar)?', options:['¢1.000','¢12.500','¢28.250','¢45.000'], correct:1, explain:'El servicio de cable cuesta ¢12.500 (más ¢1.000 adicional si hay que asociar al cliente).'},
    {q:'¿Cuál es la distancia máxima permitida para instalar cable coaxial?', options:['50 m','100 m','300 m','No hay límite'], correct:1, explain:'La distancia máxima para cable coaxial es de 100 metros.'},
    {q:'Si un asociado retira el servicio de cable y NO devuelve la caja decodificadora, ¿cuánto se le cobra por la caja?', options:['¢7.000','¢12.500','¢45.000','No se cobra nada'], correct:2, explain:'Si no se devuelve el equipo completo, la caja decodificadora tiene un valor de ¢45.000 (cada cable/control, ¢7.000).'},
    {q:'¿Dónde se revisa la "cartera castigada" de un asociado?', options:['En QUPOS','En COACO, "Consulta de cartera castigada"','En ArcGIS','En Salesforce'], correct:1, explain:'La cartera castigada se revisa en COACO, en la opción "Consulta de cartera castigada".'},
    {q:'¿Qué código de concepto se usa en FAGFI para cobrar el "diseño de planos eléctricos" (declaración de carga)?', options:['700','2705','12500','9'], correct:1, explain:'El concepto "diseño de planos eléctricos" (declaración de carga) usa el código 2705 en FAGFI, con código de IVA 700.'}
  ]
},
{
  id:'qupos',
  cat:'Sistemas y Códigos',
  title:'QUPOS: facturación y caja del almacén',
  desc:'Sistema de facturación, créditos, notas de crédito y cierre de caja del almacén/ferretería. Sustituye a MBACASE.',
  systems:['QUPOS'],
  theory:[
    {ico:'①', h:'¿Qué es QUPOS y qué reemplaza?', warn:'QUPOS es el sistema de Ventas, procesos y facturación del almacén/ferretería de Coopelesca. Sustituyó a MBACASE: toda gestión de facturación, créditos corrientes, financiamientos, notas de crédito, estado de cuenta y cierre de caja del almacén se realiza ahora en QUPOS.'},
    {ico:'②', h:'Apertura de caja', p:'Se ingresa al sistema en Ventas, procesos y facturación → se le da "Siguiente" y luego "Terminar" en las pantallas iniciales. Se despliega la pantalla de facturación para iniciar la facturación diaria.', shot:'apertura'},
    {ico:'③', h:'Proceso de facturación', list:[
      'En Facturación → "Prof/Prev/Ap" (Ctrl+F5) se ven las preventas pendientes de cobrar; se filtra por el nombre del asociado y se selecciona (F4 o doble clic).',
      'Se revisa la factura con artículos, cantidades, precios y total, se marca "Facturar".',
      'Formas de pago disponibles: Transferencia (se anota número de transacción, cuenta y banco), Efectivo, Dólares, Tarjeta (número de voucher), Mixto (combina varias formas o usa ingresos anticipados) y A crédito (solo Enter para imprimir).',
      'Nota: toda transferencia o Sinpe recibido se debe subir también a Control de caja → Depósitos bancarios → Nuevo → Caja general local.'
    ], shot:'facturacion'},
    {ico:'④', h:'Abonos, ingresos anticipados y devoluciones', list:[
      'Abonos a créditos corrientes: Facturación → "+Abonos" → se busca al cliente → se elige la factura o se distribuye el monto entre varias → se define la forma de pago.',
      'Ingresos anticipados (dinero a favor): Facturación → "+Abono" → "Nuevo ingreso"; se llena la información y se copian las notas también en "descripción"; forma de pago "ajustar".',
      'Devolución de anticipados: Facturación → "+Abono" → "Nueva devolución", para retirar dinero a favor que el asociado ya no va a usar.'
    ], shot:'abonos'},
    {ico:'⑤', h:'Estado de cuenta', p:'Muestra los ingresos anticipados y las facturas a crédito corriente del asociado. Se accede desde la pantalla principal buscando con la lupa (este paso cambió recientemente en el sistema). Es la pantalla clave para revisar deudas en trámites como el Fondo Mutual.', shot:'estadocuenta'},
    {ico:'⑥', h:'Notas de crédito y anulación de facturas', list:[
      'Nota de crédito ("devolución simple"): Facturación → Opciones → Nota de crédito. Toda nota de crédito se convierte en efectivo. Se anota número de factura y fecha, se marcan los artículos a devolver; si el dinero NO se entrega se marca "genera ingreso anticipado".',
      'Anulación de facturas: SOLO se pueden anular facturas del MISMO día y que fueron pagadas en efectivo. Si fue con otra forma de pago, se recomienda hacer nota de crédito para no anular vouchers. Se requieren las tres facturas físicas (blanca, rosada, amarilla) y autorización del líder.'
    ], shot:'notascredito'},
    {ico:'⑦', h:'Proceso de cierre de caja en QUPOS', list:[
      '1) Control de cajas: se filtra por fecha, cajero y estado "Abierta" para ver lo facturado en efectivo, vouchers y transferencias.',
      '2) Retiro del efectivo sobrante (sobre el fondo base de ¢200.000): se llena la boleta del banco y se hace el retiro en el sistema (Facturación → Opciones → Retiro), con la justificación (depósito + número de boleta). Debe registrarse también en Depósitos bancarios.',
      '3) Se descarga el reporte (Control de cajas → Imprimir → Reporte F4) en PDF para adjuntarlo al cierre.',
      '4) Facturación → Opciones → Cierre: se edita el cierre con el fondo de caja en ¢200.000, la cantidad de transferencias y vouchers, y se compara contra el reporte de Control de caja antes de confirmar.',
      '5) Se verifica en Control de cajas con estado "Cerrada" que no quede ninguna diferencia (todo en cero).',
      'Si hay un error en el retiro, se puede corregir con "Reintegro" (Facturación → Opciones → Reintegro), siempre con autorización del líder.'
    ], shot:'cierre'},
    {ico:'⑧', h:'Consultas y mantenimiento de clientes', list:[
      'Consultas de facturas: Ventas → Consultas → Ventas por facturas; permite reenviar la factura electrónica por correo o reimprimirla desde Edición.',
      'Clientes/Asociado y apertura de crédito corriente: Ventas → Mantenimiento → Clientes; el monto del crédito corriente se autoriza a solicitud del líder.',
      'Exoneraciones y configuración tributaria: Ventas → Mantenimiento → Clientes → Opciones de configuración. Ahí van los documentos de exoneración (AL/exonet) y los de agropecuarios, ley 9635 y zonas francas.',
      'Cambio de nombre de factura: se usa cuando el asociado pide corregir el nombre por error de facturación o motivos personales; se selecciona "Cliente" → "Yes" y se busca el nombre o código correcto.'
    ], shot:'clientes'},
    {ico:'⑨', h:'Financiamientos', p:'Se gestionan desde "Preventas" (bodega Ferretería/almacén, modalidad mayoreo) → se abre la preventa con su número → "Crear financiamiento" → se elige el servicio/contrato, se generan los planes y se revisa la prima (si no aplica, se corrige a 0 o se autoriza "prima menor" con justificación) → se factura desde Prof/Preventa.', shot:'financiamientos'}
  ],
  quiz:[
    {q:'¿Qué sistema reemplazó a MBACASE para la facturación, créditos y estado de cuenta del almacén?', options:['CAGCA','QUPOS','CODISP','COACO'], correct:1, explain:'QUPOS es el sistema actual de Ventas, procesos y facturación que sustituyó a MBACASE.'},
    {q:'En el proceso de facturación de QUPOS, ¿qué se debe anotar al recibir un pago por Transferencia?', options:['Solo el monto total','Número de transacción, número de cuenta y banco','El número de cédula únicamente','Nada, se acepta directo'], correct:1, explain:'Con transferencia se anota el número de transacción, número de cuenta y el banco donde se realizó, y se acepta.'},
    {q:'¿Qué facturas se pueden ANULAR en QUPOS?', options:['Cualquier factura, sin importar la fecha','Solo las facturas del mismo día y pagadas en efectivo','Solo las facturas a crédito','Ninguna, siempre se hace nota de crédito'], correct:1, explain:'Solo se pueden anular facturas del mismo día y que hayan sido pagadas en efectivo; si fue con otra forma de pago se recomienda hacer nota de crédito.'},
    {q:'¿Cuál es el fondo de caja base que debe quedar en QUPOS después del retiro de efectivo sobrante?', options:['¢100.000','¢200.000','¢390.000','¢45.000'], correct:1, explain:'El fondo de caja base es de ¢200.000, igual que en el cierre de CAGCA.'},
    {q:'¿Para qué sirve la pantalla de "Estado de cuenta" en QUPOS?', options:['Para ver el clima','Para ver los ingresos anticipados y las facturas a crédito corriente del asociado','Para registrar quejas','Para agendar citas de instalación'], correct:1, explain:'El Estado de cuenta muestra los ingresos anticipados y las facturas a crédito del asociado; es clave, por ejemplo, para revisar deudas en un trámite de Fondo Mutual.'},
    {q:'¿Qué se debe hacer si toda una nota de crédito se convierte en efectivo pero NO se le va a entregar el dinero al asociado?', options:['Se pierde el dinero','Se marca el check de "genera ingreso anticipado"','Se anula la factura','Se hace un reintegro'], correct:1, explain:'Si el dinero no se entrega en efectivo, se marca "genera ingreso anticipado" para que quede a favor del asociado.'}
  ]
},
{
  id:'cambio_condiciones_comercial',
  cat:'Medidores y Servicio Eléctrico',
  title:'Cambio de condiciones de medidores comerciales/industriales',
  desc:'Modificación de características del servicio, CTs/PTs, aumentos de carga y estudios de factibilidad.',
  systems:['CCGAC'],
  theory:[
    {ico:'①', h:'¿Con quién se gestionan estos trámites?', warn:'Estos trámites y procesos técnicos de servicios comerciales e industriales pueden gestionarse con el equipo de Proyectos Pagos o con Michael Chaves Soto, encargado de los medidores de máxima demanda, líder del departamento de Atención al Asociado y líder del equipo de Gestión de Trámites.'},
    {ico:'②', h:'Cambio de condiciones', list:[
      'Se realiza cuando el asociado necesita modificar las características del servicio eléctrico existente: cambio del tipo de medidor, modificación en la carga instalada, cambio de tarifa o clasificación del servicio, o ajustes en la forma de medición o conexión.',
      'Se solicita cuando el negocio o industria amplía operaciones o cambia su consumo: un medidor cambia a plan comercial/industrial cuando su consumo es igual o superior a 3.000 kWh.',
      'Requisito: plano eléctrico.',
      'Se realiza por medio de inspección, a través de la venta de ingeniería "Inspección para Redes Eléctricas", causal 302288.'
    ]},
    {ico:'③', h:'Adición o retiro de CTs o PTs', list:[
      'En servicios con medición indirecta o de máxima demanda se utilizan equipos especiales.',
      'CTs (Transformadores de Corriente): reducen la corriente para que el medidor pueda medirla correctamente.',
      'PTs (Transformadores de Tensión): reducen el voltaje a niveles seguros para la medición.',
      'Se realiza la adición o retiro cuando: cambia la capacidad del servicio, se instala un nuevo sistema de medición (medidor nuevo), o se modifica la configuración del medidor de máxima demanda.'
    ]},
    {ico:'④', h:'Aumentos de carga', p:'Se solicita cuando el asociado necesita mayor capacidad eléctrica para operar equipos adicionales o ampliar su actividad. Generalmente se debe presentar el plano eléctrico, y se realiza por medio de inspección a través de la venta de ingeniería "Inspección para Redes Eléctricas", causal 302288 (el mismo causal que el cambio de condiciones).'},
    {ico:'⑤', h:'Cálculo de aportes de capital para medidores de máxima demanda', p:'Cuando se instala un medidor de máxima demanda, el asociado debe cancelar un aporte de capital. El cálculo se realiza con base en la demanda calculada en el documento eléctrico, y debe ser coordinado con la líder del departamento de Atención al Asociado.'},
    {ico:'⑥', h:'Estudio de factibilidad de máxima demanda', list:[
      'Es un análisis técnico que realiza la cooperativa para determinar si la red puede soportar la demanda solicitada por el asociado.',
      'Se utiliza especialmente cuando existe duda sobre el tipo de medidor que debe instalarse, o cuando el consumo eléctrico será alto o variable.',
      'Aplica a proyectos grandes: condominios, centros comerciales o industrias (ej. El Encuentro, Plaza San Carlos, Plaza Florencia, supermercados o restaurantes grandes, locales comerciales grandes, hoteles, granjas avícolas).',
      'También permite definir el tipo de medición a instalar y si la red eléctrica necesita mejoras.',

/* Preguntas seleccionadas para la Evaluación Final: 2 por tema (se pueden editar) */
const FINAL_EXAM = buildFinalExam();
function buildFinalExam(){
  const picks=[];
  MODULES.forEach(m=>{
    // toma la 1ra y 3ra pregunta de cada módulo para variar del quiz de tema
    const idxs=[0, Math.min(2, m.quiz.length-1)];
    idxs.forEach(i=>{
      const q=m.quiz[i];
      picks.push({...q, moduleTitle:m.title});
    });
  });
  return picks;
}

/* ================================================================
   ESTADO Y PERSISTENCIA (window.storage — progreso personal)
   ================================================================ */
let progress = {}; // { moduleId: {score, total, passed} }
let finalResult = null; // {score, total}
let route = {view:'home'}; // home | topic | quiz | final | finalresult
let quizState = null;

async function loadProgress(){
  try{
    const r = await window.storage.get('progress-v1', false);
    if(r && r.value) progress = JSON.parse(r.value);
  }catch(e){ progress = {}; }
  try{
    const r2 = await window.storage.get('final-result-v1', false);
    if(r2 && r2.value) finalResult = JSON.parse(r2.value);
  }catch(e){ finalResult = null; }
  render();
}
async function saveProgress(){
  try{ await window.storage.set('progress-v1', JSON.stringify(progress), false); }catch(e){}
}
async function saveFinalResult(){
  try{ await window.storage.set('final-result-v1', JSON.stringify(finalResult), false); }catch(e){}
}

/* ================================================================
   RENDER
   ================================================================ */
function completedCount(){ return Object.values(progress).filter(p=>p.passed).length; }
function overallPct(){ return Math.round((completedCount()/MODULES.length)*100); }

function render(){
  renderSidebar();
  renderMain();
}

let openGroups = null; // se inicializa en el primer render con la categoría del tema activo abierta

function renderSidebar(){
  const el = document.getElementById('sidebar');
  const groups = {};
  MODULES.forEach(m=>{ (groups[m.cat] ||= []).push(m); });

  if(openGroups === null){
    openGroups = {};
    const activeMod = route.moduleId ? MODULES.find(m=>m.id===route.moduleId) : null;
    Object.keys(groups).forEach(cat=>{ openGroups[cat] = activeMod ? (activeMod.cat===cat) : false; });
  }

  let navHtml = '';
  Object.keys(groups).forEach((cat, gi)=>{
    const items = groups[cat];
    const doneInGroup = items.filter(m=>progress[m.id] && progress[m.id].passed).length;
    const isOpen = !!openGroups[cat];
    const gid = 'grp'+gi;
    navHtml += `<div class="nav-group ${isOpen?'open':''}" id="${gid}">
      <div class="nav-group-head" onclick="toggleGroup('${gid}','${cat.replace(/'/g,"\\'")}')">
        <span class="ttl"><span class="chev">▸</span> ${cat}</span>
        <span class="cnt">${doneInGroup}/${items.length}</span>
      </div>
      <div class="nav-list-wrap"><ul class="nav-list">`;
    items.forEach(m=>{
      const p = progress[m.id];
      const done = p && p.passed;
      const active = route.view!=='home' && route.moduleId===m.id;
      navHtml += `
        <li class="nav-item ${done?'done':''} ${active?'active':''}" onclick="goTopic('${m.id}')">
          <div class="nav-num">${done?'✓':MODULES.indexOf(m)+1}</div>
          <div class="nav-title">${m.title}</div>
          ${p?`<div class="nav-score">${p.score}/${p.total}</div>`:''}
        </li>`;
    });
    navHtml += `</ul></div></div>`;
  });

  const pct = overallPct();
  el.innerHTML = `
    <div class="brand">
      <img class="brand-logo" src="${LOGO_B64}" alt="Coopelesca R.L.">
      <div class="brand-text">
        <div class="t1">Capacitador de Trámites</div>
        <div class="t2">Coopelesca R.L.</div>
      </div>
    </div>
    <div class="progress-card">
      <div class="lbl">Avance general</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-num">${completedCount()} / ${MODULES.length} temas aprobados</div>
    </div>
    <div style="cursor:pointer" onclick="goHome()" class="nav-item ${route.view==='home'?'active':''}">
      <div class="nav-num">⌂</div><div class="nav-title">Inicio</div>
    </div>
    ${navHtml}
    <div class="final-cta">
      <button class="btn-final" onclick="goFinal()">🏁 Evaluación final</button>
      <div class="final-hint">${finalResult? `Último resultado: ${finalResult.score}/${finalResult.total}` : 'Recomendado tras completar todos los temas.'}</div>
    </div>
  `;
}

function startFinal(){

    mode:'final',
    questions: FINAL_EXAM.map(q=>({...q})),
    idx:0, answers:[], locked:false
  };
  route = {view:'finalquiz'};
  render();
}

function renderQuiz(el){
  const s = quizState;
  const total = s.questions.length;
  const q = s.questions[s.idx];
  const segs = s.questions.map((qq,i)=>{
    if(i < s.answers.length){ return s.answers[i]===qq.correct ? 'ok':'bad'; }
    if(i===s.idx) return 'on';
    return '';
  });

  el.innerHTML = `
    <button class="back-link" onclick="${s.mode==='topic'?`goTopic('${s.moduleId}')`:'goFinal()'}">← Salir de la evaluación</button>
    <div class="eyebrow"><span class="dot"></span> ${s.mode==='topic'? MODULES.find(m=>m.id===s.moduleId).title : 'Evaluación final'}</div>
    <div class="card quiz-wrap">
      <div class="quiz-progress">${segs.map(c=>`<div class="seg ${c}"></div>`).join('')}</div>
      <div class="q-count">Pregunta ${s.idx+1} de ${total}${q.moduleTitle?` · ${q.moduleTitle}`:''}</div>
      <div class="q-text">${q.q}</div>
      <div class="opt-list" id="optList">
        ${q.options.map((op,i)=>`
          <button class="opt" data-i="${i}" onclick="answerQuiz(${i})">
            <div class="letter">${String.fromCharCode(65+i)}</div>
            <div>${op}</div>
          </button>
        `).join('')}
      </div>
      <div id="explainBox"></div>
      <div class="quiz-footer" id="quizFooter"></div>
    </div>
  `;
}

function answerQuiz(i){
  const s = quizState;
  if(s.locked) return;
  s.locked = true;
  s.answers[s.idx] = i;
  const q = s.questions[s.idx];
  document.querySelectorAll('#optList .opt').forEach(btn=>{
    const bi = parseInt(btn.getAttribute('data-i'));
    btn.disabled = true;
    if(bi===q.correct) btn.classList.add('correct');
    else if(bi===i) btn.classList.add('wrong');
  });
  const ok = i===q.correct;
  document.getElementById('explainBox').innerHTML = `
    <div class="explain ${ok?'ok':'bad'}">${ok? '✅ ¡Correcto! ' : '❌ No es la opción correcta. '}${q.explain}</div>
  `;
  const isLast = s.idx === s.questions.length-1;
  document.getElementById('quizFooter').innerHTML = `
    <button class="btn-primary" onclick="${isLast? 'finishQuiz()' : 'nextQuestion()'}">${isLast? 'Ver resultado →' : 'Siguiente pregunta →'}</button>
  `;
}

function nextQuestion(){
  quizState.idx += 1;
  quizState.locked = false;
  render();
}

async function finishQuiz(){
  const s = quizState;
  const total = s.questions.length;
  const score = s.answers.filter((a,i)=>a===s.questions[i].correct).length;
  const pct = Math.round((score/total)*100);
  const passed = pct >= 70;

  if(s.mode==='topic'){
    progress[s.moduleId] = {score, total, passed};
    await saveProgress();
    route = {view:'resulttopic', moduleId:s.moduleId, score, total, passed, pct};
  } else {
    finalResult = {score, total};
    await saveFinalResult();
    route = {view:'resultfinal', score, total, passed, pct};
  }
  renderResultRoute();
}

function renderResultRoute(){
  const el = document.getElementById('main');
  const r = route;
  const isTopic = r.view==='resulttopic';
  const title = isTopic ? MODULES.find(m=>m.id===r.moduleId).title : 'Evaluación final';
  el.innerHTML = `
    <div class="card result-wrap">
      <div class="result-ring" style="--pct:${r.pct}"><span>${r.pct}%</span></div>
      <h2 class="result-title">${r.passed? '¡Tema aprobado!' : 'Casi lo lográs'}</h2>
      <p class="result-msg">
        ${title}: obtuviste <b>${r.score} de ${r.total}</b> respuestas correctas.
        ${r.passed? ' Superaste el 70% requerido.' : ' Se requiere un 70% para aprobar — repasá la teoría y volvé a intentarlo.'}
      </p>
      <div class="result-actions">
        ${isTopic? `
          <button class="btn-ghost" onclick="goTopic('${r.moduleId}')">Repasar teoría</button>
          <button class="btn-primary" onclick="startQuiz('${r.moduleId}')">Repetir evaluación</button>
          <button class="btn-ghost" onclick="goHome()">Ir al inicio</button>
        ` : `
          <button class="btn-ghost" onclick="goHome()">Ir al inicio</button>
          <button class="btn-primary" onclick="startFinal()">Repetir evaluación final</button>
        `}
      </div>
    </div>
  `;
  renderSidebar();
}

function goHome(){ route={view:'home'}; render(); }
function goTopic(id){ route={view:'topic', moduleId:id}; const m=MODULES.find(x=>x.id===id); if(openGroups) openGroups[m.cat]=true; render(); }
function toggleGroup(gid, cat){ openGroups[cat] = !openGroups[cat]; renderSidebar(); }

loadProgress();
</script>
</body>
</html>
