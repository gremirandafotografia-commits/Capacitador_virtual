<body>
<script src="/js/splash.js"></script>
<header class="barra">
  <div class="marca">
    <img class="logo-img" src="/img/coopelesca-blanco.png" alt="Coopelesca">
    <div class="sep"></div>
    <div class="marca-texto"><b>CATA</b><span>Capacitador de Atención de Trámites de Asociados</span></div>
  </div>
  <div class="acciones">
    <a class="btn-onbar" href="/manuales.html"><span class="msym">arrow_back</span> Salir</a>
    <a class="btn-onbar" id="mDescarga" href="#" target="_blank" download hidden><span class="msym">download</span> Original</a>
    <a class="btn-onbar solido" id="mDescargaPdf" href="#" target="_blank" download hidden><span class="msym">picture_as_pdf</span> Descargar PDF</a>
    <button class="btn-onbar" id="btnEditarMeta"><span class="msym">edit</span> Editar datos</button>
    <button class="btn-onbar danger" id="btnEliminar"><span class="msym">delete</span> Eliminar</button>
  </div>
</header>
<nav class="pestanas">
  <a class="pestana-card" href="/index.html" style="--pc:#0072BC"><span class="pc-aurora"></span><span class="pc-bg"></span><span class="pc-content"><span class="msym pc-icon">description</span><span class="pc-label">Trámites</span></span></a>
  <a class="pestana-card act" href="/manuales.html" style="--pc:#6C4FBC"><span class="pc-aurora"></span><span class="pc-bg"></span><span class="pc-content"><span class="msym pc-icon">menu_book</span><span class="pc-label">Manuales</span></span></a>
  <a class="pestana-card" href="/evaluaciones.html" style="--pc:#C97600"><span class="pc-aurora"></span><span class="pc-bg"></span><span class="pc-content"><span class="msym pc-icon">quiz</span><span class="pc-label">Evaluaciones</span></span></a>
  <a class="pestana-card" href="/admin.html" style="--pc:#00196E"><span class="pc-aurora"></span><span class="pc-bg"></span><span class="pc-content"><span class="msym pc-icon">admin_panel_settings</span><span class="pc-label">Administración</span></span></a>
</nav>

<main class="container manual-page" id="app" hidden>
  <div class="viewer-header manual-header">
    <span class="pill" id="mCategoria"></span>
    <h1 id="mTitulo"></h1>
    <p id="mDescripcion" style="color:var(--text-dim)"></p>
  </div>

  <div id="mBody"></div>
</main>

<main class="container narrow" id="notFound" hidden>
  <div class="empty">No se encontró este manual. <a href="/manuales.html">Volver al listado</a>.</div>
</main>

<div class="modal-backdrop" id="modalMeta" hidden>
  <div class="modal">
    <h2>Editar datos del manual</h2>
    <div class="field">
      <label>Título</label>
      <input type="text" id="eTitulo">
    </div>
    <div class="field">
      <label>Categoría / Sistema</label>
      <select id="eCategoria">
        <option>Sistema Open</option><option>Salesforce</option><option>Qupos</option>
        <option>MBA Case</option><option>Agentes de Ayuda</option><option>General</option>
      </select>
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea id="eDescripcion"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" id="eCancelar">Cancelar</button>
      <button class="btn primary" id="eGuardar">Guardar</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/admin-auth.js"></script>
<script src="/js/manual.js"></script>
</body>
</html>
