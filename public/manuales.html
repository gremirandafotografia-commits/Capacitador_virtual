<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
<title>Manuales · CATA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=description,menu_book,add_circle,save,edit,visibility,delete,arrow_back,search,videocam,photo_camera,screenshot_monitor,movie,upload_file,stop_circle,crop_square,circle,arrow_outward,text_fields,image,lightbulb,warning,error,info,link,cloud_upload,download,close,arrow_upward,arrow_downward,check_circle,folder_open,format_bold,format_italic,format_clear,mic,open_in_new">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="barra">
  <div class="marca">
    <img class="logo-img" src="/img/coopelesca-blanco.png" alt="Coopelesca">
    <div class="sep"></div>
    <div class="marca-texto"><b>CATA</b><span>Capacitador de Atención de Trámites de Asociados</span></div>
  </div>
  <div class="acciones">
    <button class="btn-onbar solido" id="btnSubir"><span class="msym">cloud_upload</span> Cargar manual</button>
  </div>
</header>
<nav class="pestanas">
  <a href="/index.html"><span class="msym">description</span> Trámites</a>
  <a class="act" href="/manuales.html"><span class="msym">menu_book</span> Manuales</a>
</nav>

<main class="container">
  <div class="page-header">
    <div>
      <h1>Manuales y documentación</h1>
      <p>Documentos ya cargados en el repositorio (carpeta <code>/manuales</code>). Súbelos aquí y quedan versionados en git.</p>
    </div>
  </div>

  <div class="filters">
    <input type="search" id="buscar" placeholder="Buscar manual...">
    <select id="filtroCategoria"><option value="">Todas las categorías</option></select>
  </div>

  <div id="grid" class="grid"></div>
</main>

<div class="modal-backdrop" id="modalSubir" hidden>
  <div class="modal">
    <h2>Cargar manual</h2>
    <div class="field">
      <label>Archivo (PDF, Word/HTML exportado, Markdown o texto)</label>
      <input type="file" id="fArchivo" accept=".pdf,.md,.markdown,.html,.htm,.txt">
    </div>
    <div class="field">
      <label>Título</label>
      <input type="text" id="fTitulo">
    </div>
    <div class="field">
      <label>Categoría / Sistema</label>
      <select id="fCategoria">
        <option>Sistema Open</option><option>Salesforce</option><option>Qupos</option>
        <option>MBA Case</option><option>Agentes de Ayuda</option><option selected>General</option>
      </select>
    </div>
    <div class="field">
      <label>Descripción</label>
      <textarea id="fDescripcion"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" id="fCancelar">Cancelar</button>
      <button class="btn primary" id="fSubir">Cargar</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/manuales.js"></script>
</body>
</html>
